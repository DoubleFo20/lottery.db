name: Continuous Lottery Auto-Update

on:
  schedule:
    # 1st and 16th of each month every 15 mins during Thai draw windows (14:30–16:30 ICT = 07:30–09:30 UTC):
    # Window 1: 14:30, 14:45 ICT
    - cron: '30,45 7 1,16 * *'
    # Window 2: 15:00, 15:15, 15:30, 15:45 ICT
    - cron: '0,15,30,45 8 1,16 * *'
    # Window 3: 16:00, 16:15, 16:30 ICT
    - cron: '0,15,30 9 1,16 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: lottery-auto-update
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch Draw Results & Retrain Pipeline
        run: |
          python analytics/result_fetcher.py

      - name: Run Node.js 3D Data & Asset Build
        run: |
          npm run build

      - name: Sync Dashboard Files
        run: |
          cp index.html strategy.html
          mkdir -p dashboard dashboard/assets
          cp index.html dashboard/strategy.html
          cp manager.html dashboard/manager.html
          cp performance.html dashboard/performance.html
          cp 3d.html dashboard/3d.html
          cp -r assets/* dashboard/assets/ 2>/dev/null || true

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Dataset is already up to date."
          else
            git commit -m "chore(auto): update draw results, refresh predictions, build 3D assets and sync dashboard [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
